name: deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or commit to deploy
        default: main
concurrency: deploy
jobs:
  deploy:
    runs-on: [self-hosted, rtbs-vm]
    steps:
      - name: Deploy and smoke test
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad ref"; exit 1; }
          cd ~/rtbs
          API_REPLICAS=3 ./deploy/native/deploy.sh "$REF"
          python3 deploy/smoke.py http://127.0.0.1:3000
